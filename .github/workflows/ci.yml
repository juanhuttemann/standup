name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Download dependencies
        run: go mod download
      # Formatting guard: gofmt is OS-invariant, Linux-only is enough.
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      # -race is load-bearing, not optional: the add/generate spinner runs a
      # writer goroutine against stderr. Only the race detector sees that
      # class of bug.
      - name: Test
        run: go test -race ./...
      # Building is not testing: runs the real binary through config load +
      # store wiring. Dummy OPENAI_* vars satisfy the required provider env;
      # `list` makes no network call. Catches the init()/wiring-panic class
      # of bug where every built binary dies while go test stays green.
      - name: Smoke test built binary
        run: |
          go build -o standup ./cmd/standup
          OPENAI_BASE_URL=http://localhost:1 OPENAI_MODEL=smoke \
            STANDUP_DATA_FILE="$RUNNER_TEMP/tasks.jsonl" \
            ./standup list | grep "no tasks"

  # Windows-only code (the update backup dance) is guarded by build tags, so
  # its tests never ran on the Linux job — and shipped a bug that failed an
  # update which had already succeeded. Windows is a released platform; its
  # code needs a machine that can run it.
  test-windows:
    name: Vet & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      # -race needs cgo; set it explicitly so a runner image without gcc
      # fails this job loudly instead of turning every tag build red via
      # release's needs: [test, test-windows, lint].
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: '1'
      # Scoped to the packages with build-tagged Windows code and their
      # callers. The rest of the suite has pre-existing portability gaps in
      # the harness itself — Unix permission bits, XDG_CONFIG_HOME, .sh fake
      # editors — none of which are product bugs, and widening this job is a
      # separate piece of work.
      - name: Test
        run: go test -race ./internal/update/... ./internal/obsidian/... ./internal/catalog/... ./internal/store/... ./internal/report/... ./internal/agent/... ./internal/sync/...
        env:
          CGO_ENABLED: '1'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      # golangci-lint defaults cover vet/errcheck/ineffassign/unused
      # (≈ make verify's golangci + deadcode + ineffassign steps).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.2
      # Cyclo is the one make-verify linter not bundled with golangci.
      - name: gocyclo
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          gocyclo -over 15 .

  release:
    name: Draft Release
    needs: [test, test-windows, lint]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs full history (previous tags)
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
