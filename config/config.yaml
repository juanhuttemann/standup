# Application settings. Precedence: STANDUP_* env > .env > this file.
meeting_time: "09:30"
data_file: "~/.standup/tasks.jsonl"
# true: no model endpoint — add splits paragraphs, generate renders deterministically.
offline: false
# Maximum duration of one model request (for example 30s or 2m).
model_call_timeout: "60s"
# text provider: openai or anthropic (empty keeps the OpenAI-compatible default).
provider: "openai"
# report language for the model's rephrasing (empty: keep the input language).
language: ""
# IANA timezone for report windows and the meeting cutoff (empty: local).
timezone: ""
# SMTP settings for `generate --mail` (empty host: mail disabled).
smtp_host: ""
smtp_port: 587
smtp_user: ""
# password comes from STANDUP_SMTP_PASSWORD env, never this file.
mail_from: ""
# `commits` repo globs (matched against each path as passed, submodules
# included): empty include = everything not excluded.
repos:
    include: []
    exclude: []
# One-way Markdown publication into an Obsidian vault (`generate --obsidian`).
obsidian:
    vault: ""
    note: "Standups/{date}.md"
# PocketBase sync for `standup sync` (empty url: sync disabled).
# PB_URL / PB_COLLECTION env override these; credentials are PB_EMAIL /
# PB_PASSWORD env, never this file.
sync:
    url: ""
    collection: "standup_tasks"
