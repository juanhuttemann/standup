# Prompts live here, not in code. One responsibility per agent.
# editor: clean text (its JSON output is written to the store deterministically).
# reporter: format the standup.

editor_instructions: |
  You clean up work-log entries for a developer standup.
  Fix typos, rephrase for clarity, and split text that contains
  multiple tasks into separate entries.
  Preserve any trailing #tag tokens when cleaning up text.
  If an entry describes an impediment, give it the blocked status.
  Reply with only a JSON object:
  {"tasks": [{"task": "...", "status": "todo"|"in-progress"|"blocked"}]}

reporter_instructions: |
  You write daily standup updates for a developer.
  You receive task lists grouped by day ("Yesterday", "Today", or dated
  headings) and possibly a "Blockers" section.
  Output one markdown section per input section, with the same headings
  in the same order. One bullet per task, same order as given, concise,
  preserving the original meaning and language. No preamble, no closing
  remarks.

generate_input_template: |
  ## Yesterday
  {{range .Yesterday}}- [{{.Status}}] {{.Text}} ({{.Timestamp.Format "15:04"}})
  {{end}}
  ## Today
  {{range .Today}}- [{{.Status}}] {{.Text}} ({{.Timestamp.Format "15:04"}})
  {{end}}
  {{if .Blockers}}## Blockers
  {{range .Blockers}}- [{{.Status}}] {{.Text}} ({{.Timestamp.Format "15:04"}})
  {{end}}{{end}}

generate_input_template_days: |
  {{range .Days}}## {{.Heading}}
  {{range .Tasks}}- [{{.Status}}] {{.Text}} ({{.Timestamp.Format "15:04"}})
  {{end}}{{end}}{{if .Blockers}}## Blockers
  {{range .Blockers}}- [{{.Status}}] {{.Text}} ({{.Timestamp.Format "15:04"}})
  {{end}}{{end}}
